name: macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+*"

permissions:
  contents: write

jobs:
  package:
    name: Package DMG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: App version from tag
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Zapret $VERSION"

      - name: Package DMG
        working-directory: app
        run: ./gradlew packageDmg --console=plain -PappVersion=${{ steps.ver.outputs.version }}

      - name: Locate DMG
        id: dmg
        run: |
          DMG=$(ls -1 app/build/compose/binaries/main/dmg/Zapret-*.dmg | head -n1)
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"
          ls -lh "$DMG"
          echo "sha256=$SHA"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zapret-${{ steps.ver.outputs.version }}-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      # Assets always land on the fixed release tag "MacOS" (not v1.0.0).
      # Example: https://github.com/nikitaSobolev2/zapret2/releases/download/MacOS/Zapret-1.0.0.dmg
      # Publish only from version tags. workflow_dispatch builds artifacts for testing only.
      - name: Publish GitHub Release asset
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: MacOS
          name: Zapret macOS
          files: ${{ steps.dmg.outputs.path }}
          fail_on_unmatched_files: true
          body: |
            ### Zapret macOS ${{ steps.ver.outputs.version }}

            DMG: https://github.com/nikitaSobolev2/zapret2/releases/download/MacOS/Zapret-${{ steps.ver.outputs.version }}.dmg

            Install with Homebrew:
            ```
            brew tap nikitaSobolev2/zapret2 https://github.com/nikitaSobolev2/zapret2
            brew install --cask zapret
            ```

      - name: Update Homebrew cask
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          ruby -e '
            path = "Casks/zapret.rb"
            text = File.read(path)
            text.sub!(/version "[^"]+"/, %(version "#{ENV["VERSION"]}"))
            text.sub!(/sha256 "[^"]+"/, %(sha256 "#{ENV["SHA256"]}"))
            File.write(path, text)
          '
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/zapret.rb
          if git diff --staged --quiet; then
            echo "Cask already up to date"
          else
            git commit -m "brew: bump zapret cask to ${VERSION}"
            git push origin "HEAD:refs/heads/${{ github.event.repository.default_branch }}"
          fi
