name: macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+*"

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  package:
    name: Package ${{ matrix.dmg_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            dmg_arch: arm64
            java_arch: aarch64
            python_arch: arm64
          - runner: macos-15-intel
            dmg_arch: x86_64
            java_arch: x64
            python_arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          architecture: ${{ matrix.java_arch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: App version from tag
        id: ver
        run: |
          # jpackage macOS: MAJOR.MINOR.PATCH only, and MAJOR must be >= 1 (no 0.x, no -dev).
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # workflow_dispatch: unique valid version for CI artifacts only (not published).
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$VERSION" =~ ^[1-9][0-9]*(\.[0-9]+){0,2}$ ]]; then
            echo "Invalid DMG package version: $VERSION (use a tag like v1.0.2; major must be >= 1)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Zapret $VERSION (${{ matrix.dmg_arch }})"

      - name: Package DMG
        working-directory: app
        run: ./gradlew packageDmg --console=plain -PappVersion=${{ steps.ver.outputs.version }}

      - name: Show packaging logs
        if: failure()
        run: |
          set +e
          echo "=== app image ==="
          ls -la app/build/compose/binaries/main/app || true
          echo "=== dmg ==="
          ls -la app/build/compose/binaries/main/dmg || true
          echo "=== compose logs ==="
          find app/build/compose/logs -type f 2>/dev/null | while read -r file; do
            echo "----- $file -----"
            cat "$file"
          done

      - name: Locate DMG
        id: dmg
        run: |
          DMG=$(ls -1 app/build/compose/binaries/main/dmg/Zapret-*-${{ matrix.dmg_arch }}.dmg | head -n1)
          test -f "$DMG"
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"
          ls -lh "$DMG"
          echo "sha256=$SHA"
          APP=$(find app/build/compose/binaries/main/app -maxdepth 2 -name Zapret.app -type d | head -n1)
          test -d "$APP"
          LAUNCHER="$APP/Contents/MacOS/Zapret"
          test -f "$LAUNCHER"
          ARCHS=$(/usr/bin/lipo -archs "$LAUNCHER")
          echo "Zapret launcher archs: $ARCHS"
          echo "$ARCHS" | grep -qw "${{ matrix.dmg_arch }}" || {
            echo "expected launcher arch ${{ matrix.dmg_arch }}, got: $ARCHS" >&2
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zapret-${{ steps.ver.outputs.version }}-${{ matrix.dmg_arch }}-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

  publish:
    name: Attach release and bump cask
    needs: package
    if: success() && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: Zapret-${{ steps.ver.outputs.version }}-*-dmg
          merge-multiple: true
          path: dist

      - name: Require both architectures
        id: hashes
        run: |
          set -euo pipefail
          ARM="dist/Zapret-${{ steps.ver.outputs.version }}-arm64.dmg"
          INTEL="dist/Zapret-${{ steps.ver.outputs.version }}-x86_64.dmg"
          test -f "$ARM"
          test -f "$INTEL"
          echo "arm=$(sha256sum "$ARM" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "intel=$(sha256sum "$INTEL" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Attach DMGs to version release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: zapret2 ${{ github.ref_name }}
          files: dist/*.dmg
          fail_on_unmatched_files: true
          append_body: true
          body: |

            ### Zapret macOS ${{ steps.ver.outputs.version }}

            Apple Silicon: https://github.com/nikitaSobolev2/zapret2/releases/download/${{ github.ref_name }}/Zapret-${{ steps.ver.outputs.version }}-arm64.dmg

            Intel: https://github.com/nikitaSobolev2/zapret2/releases/download/${{ github.ref_name }}/Zapret-${{ steps.ver.outputs.version }}-x86_64.dmg

            ```
            brew tap nikitaSobolev2/zapret2 https://github.com/nikitaSobolev2/zapret2
            brew install --cask zapret
            brew upgrade --cask zapret
            ```

      - name: Update Homebrew cask
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA256_ARM: ${{ steps.hashes.outputs.arm }}
          SHA256_INTEL: ${{ steps.hashes.outputs.intel }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git checkout -B "brew-bump-${VERSION}"

          ruby <<-'RUBY'
          path = "Casks/zapret.rb"
          text = File.read(path)
          version = ENV.fetch("VERSION")
          arm = ENV.fetch("SHA256_ARM")
          intel = ENV.fetch("SHA256_INTEL")
          unless text.include?("arch arm:")
            text.sub!(/cask "zapret" do\n/, %(cask "zapret" do\n  arch arm: "arm64", intel: "x86_64"\n\n))
          end
          text.sub!(/version "[^"]+"/, %(version "#{version}"))
          if text =~ /sha256 arm:/
            text.sub!(/sha256 arm:\s+"[a-fA-F0-9]+"\s*,\s*\n?\s*intel:\s+"[a-fA-F0-9]+"/, %(sha256 arm: "#{arm}",\n         intel: "#{intel}"))
          else
            text.sub!(/sha256 "[^"]+"/, %(sha256 arm: "#{arm}",\n         intel: "#{intel}"))
          end
          old_url = 'Zapret-#{version}.dmg'
          new_url = 'Zapret-#{version}-#{arch}.dmg'
          text.gsub!(old_url, new_url) unless text.include?(new_url)
          File.write(path, text)
          RUBY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/zapret.rb
          if git diff --staged --quiet; then
            echo "Cask already up to date"
            exit 0
          fi
          git commit -m "brew: bump zapret cask to ${VERSION}"

          if ! git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"; then
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/${DEFAULT_BRANCH}"
            git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
          fi
